<script>const APP_DATA = {"chapters":[{"id":1,"title":"Meet Jesus","intro":"Matthew begins with Jesus' family story. Then we learn how Joseph listened to God's message about Jesus' birth.","sections":[{"title":"A family story","ref":"1:1–17","text":"Matthew lists people in Jesus' family line. Abraham and King David are important names in that list."},{"title":"A message for Joseph","ref":"1:18–21","text":"Mary was going to have a baby through the Holy Spirit. An angel appeared in Joseph's dream and told him to marry Mary and name the baby Jesus."},{"title":"Joseph listens","ref":"1:22–25","text":"Matthew explains that Immanuel means God is with us. Joseph obeyed the angel's message, married Mary, and gave the baby the name Jesus."}],"remember":["Mary is Jesus' mother.","An angel spoke to Joseph in a dream.","The angel said Jesus would save his people from their sins."],"memory":{"ref":"1:23","theme":"The name Immanuel reminds us that God is with us."},"reflect":"Joseph listened carefully. How can you practise listening when someone is helping you learn?"},{"id":2,"title":"Visitors and journeys","intro":"Visitors come to worship Jesus and bring him gifts. Joseph follows God's warnings and takes his family to safety.","sections":[{"title":"Visitors from the east","ref":"2:1–6","text":"Jesus was born in Bethlehem during King Herod's rule. Visitors called wise men came from the east looking for him."},{"title":"A star and special gifts","ref":"2:7–12","text":"The star led the visitors to the child. They worshiped Jesus and gave gold, frankincense, and myrrh. After a warning in a dream, they went home by a different route."},{"title":"A safe place in Egypt","ref":"2:13–15","text":"An angel warned Joseph that Herod wanted to harm Jesus. Joseph took Jesus and Mary to Egypt during the night."},{"title":"A sad time in Bethlehem","ref":"2:16–18","text":"Herod gave a cruel order that brought great sadness to families in Bethlehem. Matthew connects their grief with words spoken by the prophet Jeremiah. Read this part with a trusted adult."},{"title":"A home in Nazareth","ref":"2:19–23","text":"After Herod died, an angel told Joseph to return to Israel. Following another warning, Joseph settled with his family in Nazareth, in Galilee."}],"remember":["Jesus was born in Bethlehem.","The visitors brought three kinds of gifts: gold, frankincense, and myrrh.","The family travelled to Egypt and later lived in Nazareth."],"memory":{"ref":"2:11","theme":"The visitors honoured Jesus with worship and gifts."},"reflect":"The visitors showed that Jesus mattered to them. What is one way you can show care and respect today?"},{"id":3,"title":"Jesus is baptized","intro":"John the Baptist helps people get ready for Jesus. Jesus comes to the Jordan River to be baptized by John.","sections":[{"title":"John gets people ready","ref":"3:1–6","text":"John preached in the wilderness of Judea. He told people to turn away from wrong and turn toward God. He baptized people in the Jordan River."},{"title":"Changed hearts and actions","ref":"3:7–12","text":"John taught that turning to God should change how people live. He said someone greater than he was would come after him."},{"title":"Jesus comes to John","ref":"3:13–15","text":"Jesus travelled from Galilee to the Jordan. John first thought that Jesus should baptize him, but Jesus explained why John should baptize him now."},{"title":"A special moment","ref":"3:16–17","text":"After Jesus was baptized, God's Spirit came down like a dove. A voice from heaven spoke of Jesus as God's loved Son and expressed delight in him."}],"remember":["John baptized Jesus in the Jordan River.","John wore camel-hair clothing and a leather belt.","God's Spirit came down like a dove."],"memory":{"ref":"3:17","theme":"The Father loves Jesus and is pleased with him."},"reflect":"John said our actions should change when we turn to God. What kind action could you practise this week?"},{"id":4,"title":"Follow Jesus","intro":"Jesus chooses to obey God when he is tempted. He begins teaching, healing people, and calling others to follow him.","sections":[{"title":"Jesus is tempted","ref":"4:1–4","text":"Jesus spent forty days and nights without food in the wilderness. When the devil told him to turn stones into bread, Jesus answered using Scripture."},{"title":"Jesus keeps obeying God","ref":"4:5–11","text":"Jesus refused to test God or worship the devil. He answered from Scripture again. The devil left, and angels came to care for Jesus."},{"title":"Good news in Galilee","ref":"4:12–17","text":"Jesus moved to Capernaum by the lake. He began telling people to turn toward God because God's kingdom was near."},{"title":"Four fishermen follow","ref":"4:18–22","text":"Jesus called two pairs of brothers: Peter and Andrew, then James and John. They left their fishing work and followed him."},{"title":"Teaching and helping","ref":"4:23–25","text":"Jesus travelled around Galilee teaching and sharing the good news of God's kingdom. He healed sick people, and crowds followed him."}],"remember":["Jesus answered temptation with Scripture.","Peter and Andrew were brothers; James and John were another pair of brothers.","Jesus taught, shared good news, and healed people."],"memory":{"ref":"4:19","theme":"Jesus calls people to follow him and help others come to him."},"reflect":"Jesus made good choices when they were difficult. Who can help you make a good choice when you feel tempted to do wrong?"}],"questions":[{"id":"j1-01","ch":1,"question":"Who is Jesus' mother?","options":["Mary","Ruth","Martha"],"answer":"Mary","ref":"1:16–18","why":"Matthew names Mary as Jesus' mother."},{"id":"j1-02","ch":1,"question":"Who was Mary going to marry?","options":["Peter","Joseph","John"],"answer":"Joseph","ref":"1:18","why":"Mary was pledged to marry Joseph."},{"id":"j1-03","ch":1,"question":"How did the angel speak to Joseph?","options":["In a letter","Through a bird","In a dream"],"answer":"In a dream","ref":"1:20","why":"The angel appeared to Joseph while he was dreaming."},{"id":"j1-04","ch":1,"question":"What name did the angel tell Joseph to give the baby?","options":["Jesus","Samuel","Moses"],"answer":"Jesus","ref":"1:21","why":"The angel instructed Joseph to name the child Jesus."},{"id":"j1-05","ch":1,"question":"What would Jesus save his people from?","options":["Rainy days","Their sins","Long journeys"],"answer":"Their sins","ref":"1:21","why":"The angel said Jesus would rescue his people from sin."},{"id":"j1-06","ch":1,"question":"What does the name Immanuel mean?","options":["A mighty king","A bright star","God with us"],"answer":"God with us","ref":"1:23","why":"Matthew gives the meaning of Immanuel: God is with us."},{"id":"j1-07","ch":1,"question":"Whose name starts the family list in Matthew 1:2?","options":["Abraham","Noah","Adam"],"answer":"Abraham","ref":"1:2","why":"The family list begins with Abraham, the father of Isaac."},{"id":"j1-08","ch":1,"question":"What did Joseph do after he woke from the dream?","options":["He sailed away","He obeyed the angel's message","He went to see Herod"],"answer":"He obeyed the angel's message","ref":"1:24–25","why":"Joseph married Mary and later gave the baby the name Jesus."},{"id":"j2-01","ch":2,"question":"In which town was Jesus born?","options":["Nazareth","Bethlehem","Capernaum"],"answer":"Bethlehem","ref":"2:1","why":"Matthew says Jesus was born in Bethlehem in Judea."},{"id":"j2-02","ch":2,"question":"From which direction did the wise men come?","options":["The north","The west","The east"],"answer":"The east","ref":"2:1","why":"The visitors called wise men travelled from the east."},{"id":"j2-03","ch":2,"question":"Who was king when Jesus was born?","options":["Herod","David","Solomon"],"answer":"Herod","ref":"2:1","why":"Herod was ruling when the wise men came to find Jesus."},{"id":"j2-04","ch":2,"question":"What guided the visitors to the child?","options":["A rainbow","A star","A cloud"],"answer":"A star","ref":"2:9–10","why":"The star went ahead of them and stopped over the place where Jesus was."},{"id":"j2-05","ch":2,"question":"Which gifts did the visitors bring?","options":["Bread, fish, and water","Clothes, shoes, and blankets","Gold, frankincense, and myrrh"],"answer":"Gold, frankincense, and myrrh","ref":"2:11","why":"Matthew names these three kinds of gifts. He does not tell us how many visitors there were."},{"id":"j2-06","ch":2,"question":"After the warning in a dream, how did the visitors go home?","options":["By a different route","With King Herod","Through Herod's palace"],"answer":"By a different route","ref":"2:12","why":"They were warned not to return to Herod, so they took another route home."},{"id":"j2-07","ch":2,"question":"Where did Joseph take Jesus and Mary to keep them safe?","options":["Rome","Egypt","Babylon"],"answer":"Egypt","ref":"2:13–14","why":"An angel warned Joseph, and the family left for Egypt during the night."},{"id":"j2-08","ch":2,"question":"Where did the family live after returning to Israel?","options":["Bethlehem","Jerusalem","Nazareth"],"answer":"Nazareth","ref":"2:21–23","why":"Joseph took the family to Galilee, where they settled in Nazareth."},{"id":"j3-01","ch":3,"question":"Who preached in the wilderness to prepare people for Jesus?","options":["John the Baptist","Joseph","Andrew"],"answer":"John the Baptist","ref":"3:1–3","why":"John called people to turn toward God and get ready for the Lord."},{"id":"j3-02","ch":3,"question":"What was John's clothing made from?","options":["Silk","Camel's hair","Sheep's wool"],"answer":"Camel's hair","ref":"3:4","why":"John wore camel-hair clothing with a leather belt."},{"id":"j3-03","ch":3,"question":"What did John eat?","options":["Fish and bread","Grapes and cheese","Locusts and wild honey"],"answer":"Locusts and wild honey","ref":"3:4","why":"Matthew describes John's food as locusts and honey found in the wild."},{"id":"j3-04","ch":3,"question":"In which river did John baptize people?","options":["The Jordan","The Nile","The Euphrates"],"answer":"The Jordan","ref":"3:5–6","why":"People came to John to be baptized in the Jordan River."},{"id":"j3-05","ch":3,"question":"Who baptized Jesus?","options":["Peter","John the Baptist","James"],"answer":"John the Baptist","ref":"3:13–16","why":"Jesus came from Galilee to be baptized by John."},{"id":"j3-06","ch":3,"question":"God's Spirit came down like which bird?","options":["An eagle","A sparrow","A dove"],"answer":"A dove","ref":"3:16","why":"Matthew compares the Spirit coming down to a dove."},{"id":"j3-07","ch":3,"question":"Where did the voice come from after Jesus was baptized?","options":["Heaven","A boat","A cave"],"answer":"Heaven","ref":"3:17","why":"The voice from heaven spoke about Jesus as God's loved Son."},{"id":"j3-08","ch":3,"question":"What did John use when he baptized people?","options":["Oil","Water","Sand"],"answer":"Water","ref":"3:11","why":"John said that he baptized people with water."},{"id":"j4-01","ch":4,"question":"How long did Jesus go without food in the wilderness?","options":["Four days and nights","Forty days and nights","Seven days and nights"],"answer":"Forty days and nights","ref":"4:1–2","why":"Jesus had fasted for forty days and forty nights when he was tempted."},{"id":"j4-02","ch":4,"question":"What did the devil tell Jesus to turn stones into?","options":["Fish","Gold","Bread"],"answer":"Bread","ref":"4:3–4","why":"The devil tempted Jesus to make bread from stones. Jesus answered with Scripture."},{"id":"j4-03","ch":4,"question":"Who did Jesus say we should worship and serve?","options":["God alone","The devil","Every king"],"answer":"God alone","ref":"4:8–10","why":"Jesus refused to worship the devil and pointed to worshiping God alone."},{"id":"j4-04","ch":4,"question":"Who came to care for Jesus after the devil left?","options":["The wise men","Angels","Fishermen"],"answer":"Angels","ref":"4:11","why":"Angels came to attend to Jesus after the temptations.","optionAliases":{"The Magi":"The wise men"}},{"id":"j4-05","ch":4,"question":"Which two brothers did Jesus call first beside the lake?","options":["James and John","Moses and Aaron","Peter and Andrew"],"answer":"Peter and Andrew","ref":"4:18–20","why":"Jesus saw Simon Peter and his brother Andrew fishing and called them to follow."},{"id":"j4-06","ch":4,"question":"What work were Peter and Andrew doing when Jesus called them?","options":["Fishing","Farming","Building houses"],"answer":"Fishing","ref":"4:18","why":"They were fishermen, throwing a net into the lake."},{"id":"j4-07","ch":4,"question":"Which other pair of brothers followed Jesus in Matthew 4?","options":["Cain and Abel","James and John","Jacob and Esau"],"answer":"James and John","ref":"4:21–22","why":"Jesus called James and John while they were with their father Zebedee in a boat."},{"id":"j4-08","ch":4,"question":"What did Jesus do for the sick people brought to him?","options":["He sent them to Herod","He asked them to fish","He healed them"],"answer":"He healed them","ref":"4:23–24","why":"Jesus helped people with many kinds of illness as he taught in Galilee."}],"key":"junior","edition":"Little Explorers","ages":"7–9","range":"1–4","defaultText":20,"quickCount":5,"color":"#2857bd","dark":"#1c4194","tint":"#edf3ff","accent":"#ffd166","hero":"Big stories. Small steps.","intro":"Meet Jesus, explore four chapters, and get ready for Bible quiz day. Let’s learn one little piece at a time.","motto":"Read. Wonder. Remember.","weeks":[[1],[2],[3],[4]]};</script>
<script>/* Quiz and progress logic shared by each age-specific app. */
const QuestEngine = (() => {
  const shuffle = (list, random = Math.random) => {
    const copy = [...list];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };
  function pool(questions, {mode = 'practice', chapter = 'all', count = 10, review = []}, random = Math.random) {
    if (mode === 'mock') {
      return shuffle([...new Set(questions.map(q => q.ch))].flatMap(ch => shuffle(questions.filter(q => q.ch === ch), random).slice(0, 3)), random);
    }
    const eligible = questions.filter(q => (chapter === 'all' || q.ch === Number(chapter)) && (mode !== 'review' || review.includes(q.id)));
    return shuffle(eligible, random).slice(0, Math.min(count, eligible.length));
  }
  function newSession(questions, options, random = Math.random) {
    const chosen = pool(questions, options, random);
    if (!chosen.length) return null;
    return {id:'run-' + Date.now() + '-' + Math.random().toString(36).slice(2,8),mode:options.mode === 'mock' ? 'mock' : 'practice',scope:options.mode === 'review' ? 'review' : options.chapter || 'all',items:chosen.map(q => ({id:q.id,options:shuffle(q.options, random)})),answers:[],index:0,selected:null,checked:false,started:Date.now()};
  }
  function choose(session, option) {
    if (!session || session.checked || !session.items[session.index]?.options.includes(option)) return session;
    return {...session,selected:option};
  }
  function submit(session, questions, skip = false) {
    if (!session || session.checked || (!skip && session.selected === null)) return session;
    const item = session.items[session.index];
    const q = questions.find(q => q.id === item.id);
    const choice = skip ? null : session.selected;
    return {...session,answers:[...session.answers,{id:q.id,choice}],checked:true,selected:choice};
  }
  function advance(session) {
    if (!session || !session.checked) return session;
    if (session.index + 1 >= session.items.length) return null;
    return {...session,index:session.index + 1,selected:null,checked:false};
  }
  function finish(session, questions, now = Date.now()) {
    return {id:session.id,mode:session.mode,scope:session.scope,date:now,items:session.items.map(i=>i.id),answers:session.items.map(i=>session.answers.find(a=>a.id===i.id)||{id:i.id,choice:null})};
  }
  function summary(result, questions) {
    const byId = new Map(questions.map(q=>[q.id,q]));
    const correct = result.items.filter(id=>result.answers.find(a=>a.id===id)?.choice === byId.get(id)?.answer).length;
    const missed = result.items.filter(id=>result.answers.find(a=>a.id===id)?.choice !== byId.get(id)?.answer);
    return {correct,total:result.items.length,percent:result.items.length?Math.round(correct/result.items.length*100):0,missed};
  }
  function updateReview(review, result, questions) {
    const stats = summary(result, questions);
    return [...new Set([...review.filter(id=>!result.items.includes(id)),...stats.missed])];
  }
  function defaults(data) {
    return {version:1,read:[],known:[],review:[],weeks:[],history:[],session:null,lastChapter:data.chapters[0].id,textSize:data.defaultText};
  }
  function normalise(raw, data) {
    const base=defaults(data), questions=data.questions, qMap=new Map(questions.map(q=>[q.id,q])), chapterIds=data.chapters.map(c=>c.id);
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return base;
    const currentOption=(id,value)=>{
      const aliases=qMap.get(id)?.optionAliases;
      return typeof value==='string'&&aliases&&Object.prototype.hasOwnProperty.call(aliases,value)?aliases[value]:value;
    };
    const unique=(v,valid)=>Array.isArray(v)?[...new Set(v.filter(x=>valid.includes(x)))]:[];
    base.read=unique(raw.read,chapterIds); base.known=unique(raw.known,[...qMap.keys()]);base.review=unique(raw.review,[...qMap.keys()]);
    base.known=base.known.filter(id=>!base.review.includes(id));
    base.weeks=unique(raw.weeks,Array.from({length:4},(_,i)=>[0,1,2].map(j=>`${i}-${j}`)).flat());
    base.textSize=[18,20,22].includes(raw.textSize)?raw.textSize:base.textSize;
    base.lastChapter=chapterIds.includes(raw.lastChapter)?raw.lastChapter:base.lastChapter;
    if(Array.isArray(raw.history))base.history=raw.history.slice(0,20).flatMap(r=>{
      if(!r||typeof r.id!=='string'||r.id.length>80||!Number.isFinite(r.date)||!Array.isArray(r.items)||!r.items.length||r.items.length>questions.length||new Set(r.items).size!==r.items.length||!r.items.every(id=>qMap.has(id))||!Array.isArray(r.answers))return [];
      const answers=r.items.map(id=>{const a=r.answers.find(a=>a&&a.id===id),choice=currentOption(id,a?.choice);return {id,choice:qMap.get(id).options.includes(choice)?choice:null};});
      return [{id:r.id,mode:r.mode==='mock'?'mock':'practice',scope:r.scope==='review'?'review':chapterIds.includes(Number(r.scope))?Number(r.scope):'all',date:r.date,items:r.items,answers}];
    });
    let s=raw.session;
    if(s&&typeof s==='object'&&!Array.isArray(s))s={...s,
      items:Array.isArray(s.items)?s.items.map(i=>i&&typeof i==='object'?{...i,options:Array.isArray(i.options)?i.options.map(o=>currentOption(i.id,o)):i.options}:i):s.items,
      answers:Array.isArray(s.answers)?s.answers.map(a=>a&&typeof a==='object'?{...a,choice:currentOption(a.id,a.choice)}:a):s.answers,
      selected:currentOption(s.items?.[s.index]?.id,s.selected)
    };
    if(s&&typeof s.id==='string'&&s.id.length<80&&Array.isArray(s.items)&&s.items.length&&s.items.length<=questions.length&&new Set(s.items.map(i=>i?.id)).size===s.items.length&&s.items.every(i=>qMap.has(i?.id)&&Array.isArray(i.options)&&i.options.length===qMap.get(i.id).options.length&&new Set(i.options).size===i.options.length&&i.options.every(o=>qMap.get(i.id).options.includes(o)))&&Array.isArray(s.answers)&&Number.isInteger(s.index)&&s.index>=0&&s.index<s.items.length&&s.answers.length===s.index+(s.checked?1:0)&&s.answers.every((a,i)=>a?.id===s.items[i].id&&(a.choice===null||s.items[i].options.includes(a.choice)))){
      base.session={id:s.id,mode:s.mode==='mock'?'mock':'practice',scope:s.scope==='review'?'review':chapterIds.includes(Number(s.scope))?Number(s.scope):'all',items:s.items,answers:s.answers,index:s.index,selected:s.checked?s.answers[s.index].choice:s.items[s.index].options.includes(s.selected)?s.selected:null,checked:!!s.checked,started:Number.isFinite(s.started)?s.started:Date.now()};
    }
    return base;
  }
  return Object.freeze({shuffle,pool,newSession,choose,submit,advance,finish,summary,updateReview,defaults,normalise});
})();
</script>
<script>'use strict';
const D=APP_DATA, C=D.chapters, Q=D.questions, Engine=QuestEngine;
const storageKey='matthew-quest-'+D.key+'-v1';

const E=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={book:'M3 4h6c2 0 3 1 3 2v15c0-2-1-3-3-3H3V4Zm18 0h-6c-2 0-3 1-3 2v15c0-2 1-3 3-3h6V4Z',grid:'M3 3h7v7H3V3Zm11 0h7v7h-7V3ZM3 14h7v7H3v-7Zm11 0h7v7h-7v-7Z',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z',check:'m5 12 4 4L19 6',chart:'M4 20h16M7 16V9m5 7V4m5 12v-5',help:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM9.5 8a2.5 2.5 0 1 1 4 2c-1.5.8-1.5 1.5-1.5 3m0 4h.01',close:'m6 6 12 12M6 18 18 6',cards:'M6 5h14v16H6V5ZM3 17V2h14',heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z',refresh:'M20 7v5h-5M4 17v-5h5M5.2 7a8 8 0 0 1 13-2L20 7M4 17l1.8 2A8 8 0 0 0 19 17',calendar:'M4 5h16v16H4V5ZM8 2v6m8-6v6M4 11h16',trophy:'M8 3h8v7a4 4 0 0 1-8 0V3Zm0 2H4v3c0 3 2 4 5 4m7-7h4v3c0 3-2 4-5 4m-3 2v7m-4 0h8',download:'M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5',upload:'M12 16V4m-4 4 4-4 4 4M4 16v5h16v-5',clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm0-16v6l4 2',circle:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z',sun:'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0-15v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2 2m11.6 11.6 2 2M4.2 19.8l2-2M17.8 6.2l2-2'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.book}"/></svg>`;
const verseURL=ref=>'https://www.biblegateway.com/passage/?search='+encodeURIComponent('Matthew '+String(ref).replace(/–/g,'-'))+'&version=NKJV';
const verseLink=(ref,label='Read Matthew '+ref+' in NKJV',cls='text-button')=>`<a class="${cls}" href="${verseURL(ref)}" target="_blank" rel="noopener noreferrer">${E(label)}</a>`;
let storageWorks=true, state;
try{state=Engine.normalise(JSON.parse(localStorage.getItem(storageKey)||'null'),D);}catch{state=Engine.defaults(D);storageWorks=false;}
let page='chapters', value='', setup={chapter:'all',count:D.quickCount}, flash={chapter:'all',filter:'all',deck:[],index:0,flipped:false}, pendingStart=null,toastTimer,dialogFocus;
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{storageWorks=false;}}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3000);}
function applyTheme(){const root=document.documentElement;root.style.setProperty('--primary',D.color);root.style.setProperty('--primary-dark',D.dark);root.style.setProperty('--tint',D.tint);root.style.setProperty('--accent',D.accent);root.style.fontSize=state.textSize+'px';document.getElementById('edition').textContent=D.edition;document.getElementById('footer-scope').textContent=`Ages ${D.ages} · Matthew ${D.range} · NKJV companion`;document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));}
const navItems=[['chapters','Chapters','book'],['practice','Practice','spark'],['progress','Progress','chart']];
function nav(){const active=['chapter','chapters'].includes(page)?'chapters':['practice','quiz','result','cards'].includes(page)?'practice':'progress';document.getElementById('main-nav').innerHTML=navItems.map(([id,label,ic])=>`<a href="#${id}" ${active===id?'class="active" aria-current="page"':''}>${icon(ic)}${label}</a>`).join('');}
function go(hash){if(location.hash==='#'+hash)route();else location.hash=hash;}
function route(){const parts=(location.hash.slice(1)||'chapters').split('/');page=['chapters','chapter','practice','quiz','result','cards','progress'].includes(parts[0])?parts[0]:'chapters';value=parts[1]||'';if(page==='chapter'&&!byChapter(value))page='chapters';if(page==='quiz'&&!state.session)page='practice';if(page==='chapter'){state.lastChapter=Number(value);save();}if(page==='cards'&&!flash.deck.length)resetCards();render(true);}
function render(scroll=false){nav();const views={chapters:chaptersView,chapter:()=>chapterView(byChapter(value)),practice:practiceView,quiz:quizView,result:resultView,cards:cardsView,progress:progressView};document.getElementById('main').innerHTML=(!storageWorks?'<div class="storage-warning">Your browser is not saving progress right now. You can still study. Use “Back up progress” before closing the app.</div>':'')+views[page]();if(scroll){window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});}document.title=`${page==='chapter'?'Matthew '+value:page==='quiz'?'Quiz':page==='cards'?'Flashcards':page==='progress'?'Your progress':page==='result'?'Quiz results':D.edition} · Matthew Quest · NKJV`;}
function resume(){const s=state.session;return s?`<section class="resume"><div><h2>Your quiz is saved</h2><p>${s.answers.length} of ${s.items.length} answered. Pick up where you left off.</p></div><a class="btn" href="#quiz">Continue my quiz</a></section>`:'';}
function chaptersView(){const next=C.find(c=>!state.read.includes(c.id))||byChapter(state.lastChapter)||C[0];return `${resume()}<section class="hero"><div><div class="eyebrow">AGES ${D.ages} · MATTHEW ${D.range}</div><h1>${E(D.hero)}</h1><p>${E(D.intro)}</p><a class="btn" href="#chapter/${next.id}">${state.read.length?'Continue with':'Start with'} Matthew ${next.id}</a></div><div class="hero-art" aria-hidden="true"><div class="book-seal">${icon('book')}</div><span class="art-caption">${icon('heart')}${E(D.motto)}</span></div></section><section><div class="section-heading"><div><h2>${D.key==='junior'?'Choose a chapter':'Your chapters'}</h2><p>${state.read.length} of ${C.length} studied · Go at your own pace</p></div><span class="pill">${Q.length} practice questions</span></div><div class="chapter-grid">${C.map(c=>`<a class="chapter-link" href="#chapter/${c.id}" aria-label="Study Matthew ${c.id}: ${E(c.title)}"><span class="chapter-emblem">${icon(state.read.includes(c.id)?'check':'book')}</span><div><div class="chapter-kicker">MATTHEW ${c.id}</div><h3>${E(c.title)}</h3><p>${E(c.sections.slice(0,2).map(s=>s.title).join(' · '))}</p><span class="pill ${state.read.includes(c.id)?'success':''}">${state.read.includes(c.id)?'Studied':'Open chapter guide'}</span></div></a>`).join('')}</div></section><section class="quick-tips" aria-label="How to study"><div class="tip">${icon('book')}<h3>Read a little</h3><p>${D.key==='junior'?'Read your NKJV Bible with a grown-up.':'Start with the NKJV chapter, then explore the guide.'}</p></div><div class="tip">${icon('cards')}<h3>Say it back</h3><p>Retell the story or try a few flashcards.</p></div><div class="tip">${icon('spark')}<h3>Give it a try</h3><p>A short quiz helps you see what to revisit.</p></div></section>`;}
function chapterView(c){const index=C.indexOf(c);return `<div class="back-row"><a class="text-button" href="#chapters">All chapters</a><label class="sr-only" for="chapter-jump">Choose a chapter</label><select class="select" id="chapter-jump">${C.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>Matthew ${x.id}</option>`).join('')}</select></div><section class="lesson-header"><span class="eyebrow">MATTHEW ${c.id} · CHAPTER GUIDE</span><h1>${E(c.title)}</h1><p>${E(c.intro)}</p></section><section class="reading-box"><div><h2>${D.key==='junior'?'First, read with a grown-up':'Start with the full chapter'}</h2><p>Read the exact NKJV wording. The reading link opens Bible Gateway in a new tab.</p></div>${verseLink(c.id,'Read Matthew '+c.id+' in NKJV','btn')}</section><div class="lesson-grid"><div>${c.sections.map(s=>`<section class="lesson-section"><span class="pill">Matthew ${E(s.ref)}</span><h2>${E(s.title)}</h2><p>${E(s.text)}</p>${verseLink(s.ref,'Read this part in NKJV')}</section>`).join('')}<section class="reflection"><h2>${D.key==='junior'?'Let’s talk':'Think it through'}</h2><p>${E(c.reflect)}</p></section><div class="lesson-actions"><button class="btn ${state.read.includes(c.id)?'secondary':''}" data-action="mark-read" data-chapter="${c.id}">${icon(state.read.includes(c.id)?'check':'book')}${state.read.includes(c.id)?'Studied · undo':'Mark chapter studied'}</button><button class="btn secondary" data-action="chapter-quiz" data-chapter="${c.id}">Try ${D.key==='junior'?5:8} questions</button></div></div><aside class="lesson-side"><section class="panel"><span class="eyebrow">KEEP THESE IN MIND</span><h2 class="mt-3">Remember</h2><ul class="remember-list">${c.remember.map(x=>`<li>${E(x)}</li>`).join('')}</ul></section><section class="panel tint"><span class="eyebrow">MEMORY PRACTICE</span><div class="memory-ref">Matthew ${E(c.memory.ref)}</div><p>${E(c.memory.theme)}</p><p class="small">This is a meaning reminder. Learn the exact wording from your NKJV Bible.</p>${verseLink(c.memory.ref,'Open memory passage')}</section><section class="panel"><h2>Remember it together</h2><p>Say an answer before flipping the card. Revisit any that feel tricky.</p><button class="btn secondary mt-5 w-full" data-action="chapter-cards" data-chapter="${c.id}">${icon('cards')}Chapter flashcards</button></section></aside></div><div class="chapter-footer">${index>0?`<a class="btn secondary" href="#chapter/${C[index-1].id}">Matthew ${C[index-1].id}</a>`:'<a class="btn secondary" href="#chapters">All chapters</a>'}${index<C.length-1?`<a class="btn" href="#chapter/${C[index+1].id}">Next: Matthew ${C[index+1].id}</a>`:'<a class="btn" href="#practice">Review all chapters</a>'}</div><p class="notice">Chapter guides are original summaries. Use the NKJV Bible for the complete chapter and exact wording.</p>`;}
function chapterOptions(selected){return `<option value="all" ${selected==='all'?'selected':''}>All chapters · Matthew ${D.range}</option>${C.map(c=>`<option value="${c.id}" ${Number(selected)===c.id?'selected':''}>Matthew ${c.id}</option>`).join('')}`;}
function practiceView(){const available=Q.filter(q=>setup.chapter==='all'||q.ch===Number(setup.chapter)).length;const lengths=[...new Set([5,Math.min(10,available),Math.min(20,available),available])].filter(n=>n<=available).sort((a,b)=>a-b);if(!lengths.includes(setup.count))setup.count=Math.min(10,available);return `${resume()}<div class="intro"><div class="eyebrow">SMALL STEPS. MORE CONFIDENCE.</div><h1>${D.key==='junior'?'Ready to have a go?':'Make practice work for you.'}</h1><p>Choose a chapter or mix them together. There is no timer, and your quiz saves as you go.</p></div><div class="practice-grid"><section class="panel"><span class="pill">A good place to start</span><h2 class="mt-4">Quick practice</h2><p>See the answer and a short explanation after each question.</p><div class="form-row"><div class="form-field"><label class="form-label" for="quiz-chapter">Chapters</label><select class="select" id="quiz-chapter">${chapterOptions(setup.chapter)}</select></div><div class="form-field"><label class="form-label" for="quiz-length">How many questions?</label><select class="select" id="quiz-length">${lengths.map(n=>`<option value="${n}" ${setup.count===n?'selected':''}>${n} questions${n===available?' · all':''}</option>`).join('')}</select></div></div><button class="btn w-full" data-action="start-practice">${icon('spark')}Start practice</button></section><div class="option-panels"><section class="panel mode-card">${icon('cards')}<div><h2>Flashcards</h2><p>Say it out loud, flip the card, and check your answer. Uses your selected chapters.</p><button class="btn secondary" data-action="start-cards">Open flashcards</button></div></section><section class="panel mode-card">${icon('trophy')}<div><h2>${D.key==='junior'?'Big review':'Quiz day practice'}</h2><p>${C.length*3} questions, with three from each chapter. See your answers together at the end.</p><button class="btn secondary" data-action="start-mock">Start full review</button></div></section>${state.review.length?`<section class="panel tint mode-card">${icon('refresh')}<div><h2>Try these again</h2><p>${state.review.length} question${state.review.length===1?'':'s'} from your quizzes could use another look.</p><button class="btn secondary" data-action="start-review">Practise missed questions</button></div></section>`:''}</div></div><p class="notice">These are practice questions, not the official competition. Your teacher’s chapter list and rules come first.</p>`;}
function startQuiz(options, confirmed=false){if(state.session&&!confirmed){pendingStart=options;showDialog('You have a saved quiz',`<p>Keep going with your saved quiz, or start a fresh one. Starting fresh replaces the unfinished quiz.</p><div class="button-row"><button class="btn" data-action="resume-dialog">Continue saved quiz</button><button class="btn secondary" data-action="replace-quiz">Start a fresh quiz</button></div>`);return;}state.session=Engine.newSession(Q,options);if(!state.session){toast('No questions in this set yet.');return;}save();go('quiz');}
function quizView(){const s=state.session;if(!s)return practiceView();const item=s.items[s.index],q=byQuestion(item.id),chosen=s.answers.find(a=>a.id===q.id),isCorrect=chosen?.choice===q.answer;return `<div class="quiz-shell"><div class="quiz-meta"><strong>${s.mode==='mock'?'Full review':'Practice'} · Question ${s.index+1} of ${s.items.length}</strong><span class="muted">${s.mode==='mock'?'Answers at the end':'Take your time'}</span></div><div class="progress-track" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="${s.items.length}" aria-valuenow="${s.answers.length}"><div class="progress-fill" style="width:${s.answers.length/s.items.length*100}%"></div></div><section class="quiz-panel"><div class="eyebrow">MATTHEW ${q.ch}</div><h1 class="question" id="question-heading">${E(q.question)}</h1><div class="options" role="group" aria-labelledby="question-heading">${item.options.map((o,i)=>{let cls=s.selected===o?'selected':'';if(s.checked&&s.mode==='practice'){if(o===q.answer)cls='correct';else if(o===s.selected)cls='wrong';}return `<button class="option ${cls}" data-action="answer" data-index="${i}" aria-pressed="${s.selected===o}" ${s.checked?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span class="flex-1">${E(o)}</span>${s.checked&&s.mode==='practice'&&o===q.answer?icon('check'):''}</button>`;}).join('')}</div>${s.checked&&s.mode==='practice'?`<div class="feedback ${isCorrect?'':'missed'}" role="status"><strong>${isCorrect?'You’ve got it!':chosen?.choice===null?'Let’s learn this one.':'A good one to revisit.'}</strong>${!isCorrect?`<p class="correct-answer">Answer: ${E(q.answer)}</p>`:''}<p>${E(q.why)}</p>${verseLink(q.ref)}</div>`:''}<div class="quiz-controls">${s.checked?`<span class="small muted">One question at a time.</span><button class="btn" data-action="next-question">${s.index+1===s.items.length?'See my results':'Next question'}</button>`:`<button class="text-button" data-action="skip-question">I’m not sure</button><button class="btn" data-action="check-answer" ${s.selected===null?'disabled':''}>${s.mode==='mock'?(s.index+1===s.items.length?'Finish review':'Save answer & continue'):'Check my answer'}</button>`}</div></section><div class="quiz-leave"><button class="text-button" data-action="save-quiz">Save & leave quiz</button><button class="text-button" data-action="end-quiz">Finish early</button></div></div>`;}
function submitAnswer(skip=false){const s=Engine.submit(state.session,Q,skip);state.session=s;save();if(s.mode==='mock'){nextQuestion();}else render();}
function nextQuestion(){if(!state.session?.checked)return;const next=Engine.advance(state.session);if(!next)finishQuiz();else{state.session=next;save();render(true);}}
function finishQuiz(){if(!state.session)return;const result=Engine.finish(state.session,Q);state.history=[result,...state.history.filter(r=>r.id!==result.id)].slice(0,20);state.review=Engine.updateReview(state.review,result,Q);state.known=state.known.filter(id=>!state.review.includes(id));state.session=null;save();go('result/'+result.id);}
function answerCard(q,r){const choice=r.answers.find(a=>a.id===q.id)?.choice;const correct=choice===q.answer;return `<article class="review-card"><span class="pill ${correct?'success':''}">${correct?'Correct':'Revisit'} · Matthew ${q.ch}</span><h3>${E(q.question)}</h3><p class="small muted">Your answer: ${choice===null||choice===undefined?'Not answered':E(choice)}</p><p class="correct-answer">Answer: ${E(q.answer)}</p><p>${E(q.why)}</p>${verseLink(q.ref)}</article>`;}
function resultView(){const r=state.history.find(r=>r.id===value);if(!r)return `<div class="empty"><h1>No result saved here</h1><p>Complete a quiz to see your results.</p><a class="btn" href="#practice">Go to practice</a></div>`;const stats=Engine.summary(r,Q);return `<div class="quiz-shell"><section class="result-header"><span class="eyebrow">${r.mode==='mock'?'FULL REVIEW':'PRACTICE'} COMPLETE</span><div class="result-score mt-4">${stats.correct} / ${stats.total}</div><span class="pill">${stats.percent}% correct</span><h1>${stats.correct===stats.total?'You remembered every one!':stats.percent>=70?'You’re building confidence.':'Every try helps you learn.'}</h1><p>${stats.missed.length?`${stats.missed.length} question${stats.missed.length===1?' is':'s are'} ready to revisit. Read the explanation, then give ${stats.missed.length===1?'it':'them'} another try.`:'Keep reading the chapters and practise again another day.'}</p><div class="button-row">${stats.missed.length?'<button class="btn" data-action="retry-result">Try missed questions again</button>':'<a class="btn" href="#chapters">Back to my chapters</a>'}<a class="btn" href="#practice">Choose another practice</a></div></section>${stats.missed.length?`<div class="section-heading"><h2>Questions to revisit</h2></div>${stats.missed.map(id=>answerCard(byQuestion(id),r)).join('')}`:''}<details class="mt-6"><summary class="text-button">See all ${stats.total} answers</summary><div class="mt-4">${r.items.map(id=>answerCard(byQuestion(id),r)).join('')}</div></details><p class="notice">One point per correct answer. Unanswered questions count as missed.</p></div>`;}
function resetCards(){flash.deck=Engine.shuffle(Q.filter(q=>(flash.chapter==='all'||q.ch===Number(flash.chapter))&&(flash.filter==='all'||flash.filter==='review'&&state.review.includes(q.id)||flash.filter==='learning'&&!state.known.includes(q.id))).map(q=>q.id));flash.index=0;flash.flipped=false;}
function openCards(chapter='all'){flash.chapter=String(chapter);flash.filter='all';resetCards();go('cards');}
function cardsView(){const done=flash.index>=flash.deck.length;const q=byQuestion(flash.deck[flash.index]);return `<div class="flash-shell"><a class="text-button mb-5" href="#practice">Back to practice</a><div class="intro"><div class="eyebrow">SAY IT. FLIP IT. REMEMBER IT.</div><h1>One card at a time.</h1><p>${D.key==='junior'?'Ask a grown-up to read the question, then say your answer.':'Say your answer before you turn the card over.'}</p></div><div class="form-row"><div class="form-field"><label class="form-label" for="flash-chapter">Chapters</label><select class="select" id="flash-chapter">${chapterOptions(flash.chapter)}</select></div><div class="form-field"><label class="form-label" for="flash-filter">Which cards?</label><select class="select" id="flash-filter"><option value="all" ${flash.filter==='all'?'selected':''}>All cards</option><option value="learning" ${flash.filter==='learning'?'selected':''}>Still learning</option><option value="review" ${flash.filter==='review'?'selected':''}>Needs practice</option></select></div></div>${!flash.deck.length?`<div class="empty mt-6">${icon('check')}<h2>No cards in this set</h2><p>Choose “All cards” to keep exploring.</p><button class="btn" data-action="all-cards">Show all cards</button></div>`:done?`<div class="empty mt-6">${icon('trophy')}<h2>You reached the end!</h2><p>You have ${state.known.length} cards marked as learned across your chapters.</p><div class="button-row"><button class="btn" data-action="shuffle-cards">Go through these again</button><a class="btn secondary" href="#practice">Try a quiz</a></div></div>`:`<div class="flash-toolbar"><strong>Card ${flash.index+1} of ${flash.deck.length}</strong><span class="pill">Matthew ${q.ch}</span></div><button class="flash-card ${flash.flipped?'flipped':''}" data-action="flip-card" aria-expanded="${flash.flipped}" aria-label="${flash.flipped?'Flashcard answer. Tap to see question.':'Flashcard question. Tap to see answer.'}"><span class="eyebrow">${flash.flipped?'THE ANSWER':'THINK FIRST'}</span><span class="flash-text">${E(flash.flipped?q.answer:q.question)}</span>${flash.flipped?`<span class="flash-explanation">${E(q.why)}</span>`:''}<span class="flash-hint">${icon('refresh')}${flash.flipped?'Tap to see the question':'Tap to see the answer'}</span></button><div class="flash-buttons"><button class="btn secondary" data-action="card-review" ${flash.flipped?'':'disabled'}>Practise again</button><button class="btn" data-action="card-known" ${flash.flipped?'':'disabled'}>${icon('check')}I know this</button></div><div class="flash-bottom"><button class="btn secondary" data-action="previous-card" ${flash.index===0?'disabled':''}>Previous</button>${flash.flipped?verseLink(q.ref,'Read the NKJV passage'):''}<button class="btn secondary" data-action="next-card">Next card</button></div><p class="notice">“I know this” saves a card as learned. “Practise again” adds it to your review set.</p>`}</div>`;}
function showNextCard(){render();const card=document.querySelector('.flash-card, .flash-shell .empty');card?.scrollIntoView({block:'start'});card?.focus({preventScroll:true});}
function rateCard(known){const id=flash.deck[flash.index];if(!id||!flash.flipped)return;if(known){state.known=[...new Set([...state.known,id])];state.review=state.review.filter(x=>x!==id);}else{state.review=[...new Set([...state.review,id])];state.known=state.known.filter(x=>x!==id);}save();flash.index++;flash.flipped=false;showNextCard();toast(known?'Saved as learned.':'Saved for more practice.');}
function weekTasks(index){const ids=D.weeks[index];return ids.length?[`Read Matthew ${ids.length===1?ids[0]:ids[0]+'–'+ids[ids.length-1]} in your NKJV Bible.`,`Talk through the chapter guides and memory passages.`,`Try a short quiz, then revisit any missed answers.`]:['Revisit your notes for every assigned chapter.','Practise your memory passages and missed questions.',`Try the ${C.length*3}-question full review.`];}
function progressView(){const total=state.history.reduce((sum,r)=>sum+r.items.length,0),correct=state.history.reduce((sum,r)=>sum+Engine.summary(r,Q).correct,0);return `<div class="intro"><div class="eyebrow">YOUR SMALL STEPS COUNT</div><h1>Look what you’re learning.</h1><p>See what you’ve studied and decide what to practise next.</p></div>${resume()}<div class="stats"><div class="stat"><strong>${state.read.length}/${C.length}</strong><span>Chapters studied</span></div><div class="stat"><strong>${state.known.length}/${Q.length}</strong><span>Cards learned</span></div><div class="stat"><strong>${state.history.length}</strong><span>Quizzes completed</span></div></div><div class="progress-layout"><section class="panel"><h2>Chapter by chapter</h2>${C.map(c=>`<a class="chapter-progress" href="#chapter/${c.id}">${icon(state.read.includes(c.id)?'check':'book')}<div><h3>Matthew ${c.id} · ${E(c.title)}</h3><p>${state.read.includes(c.id)?'Studied':'Ready to read'} · ${state.known.filter(id=>byQuestion(id)?.ch===c.id).length}/8 cards learned</p></div></a>`).join('')}</section><div><section class="panel tint"><h2>Your next step</h2><p>${state.review.length?`${state.review.length} question${state.review.length===1?' is':'s are'} in your review set. A fresh try can make the answer stick.`:state.read.length<C.length?'Choose a chapter, read it in your Bible, and try a little practice.':'Try the full review to connect what you have learned across your chapters.'}</p><button class="btn mt-5" data-action="${state.review.length?'start-review':'next-step'}">${state.review.length?'Practise missed questions':'Keep learning'}</button></section><section class="panel mt-5"><h2>Recent quizzes</h2>${state.history.length?`<p class="small">${Math.round(correct/total*100)}% correct across your last ${state.history.length} quizzes.</p>${state.history.slice(0,5).map(r=>{const s=Engine.summary(r,Q);return `<button class="history-item" data-action="view-result" data-id="${E(r.id)}"><div><strong>${r.mode==='mock'?'Full review':r.scope==='review'?'Missed-question practice':r.scope==='all'?'Mixed practice':'Matthew '+r.scope}</strong><span>${new Date(r.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · View answers</span></div><strong>${s.correct}/${s.total}</strong></button>`;}).join('')}`:'<p>Your completed quizzes will appear here.</p>'}</section></div></div><section><div class="section-heading"><div><h2>Your four-week plan</h2><p>Start whenever you’re ready · ${state.weeks.length}/12 steps complete</p></div></div><div class="weeks">${D.weeks.map((ids,i)=>`<article class="week"><span class="eyebrow">WEEK ${i+1}</span><h3>${ids.length?'Matthew '+(ids.length===1?ids[0]:ids[0]+'–'+ids[ids.length-1]):'Bring it all together'}</h3>${weekTasks(i).map((label,j)=>`<label class="check-row ${state.weeks.includes(i+'-'+j)?'checked':''}"><input type="checkbox" data-week="${i}-${j}" ${state.weeks.includes(i+'-'+j)?'checked':''}><span>${E(label)}</span></label>`).join('')}</article>`).join('')}</div></section><section class="panel backup"><h2>Keep your progress</h2><p>Your progress stays in this browser on this device. It does not sync with your teacher or another device.</p><div class="button-row"><button class="btn secondary" data-action="export">${icon('download')}Back up progress</button><button class="btn secondary" data-action="import">${icon('upload')}Restore a backup</button><button class="text-button" data-action="reset">Reset this app’s progress</button></div><input id="import-file" type="file" accept="application/json,.json" hidden></section>`;}
function showDialog(title,html){dialogFocus=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=html;const dialog=document.getElementById('dialog');if(!dialog.open)dialog.showModal();document.getElementById('dialog-body').querySelector('button')?.focus();}
function closeDialog(){document.getElementById('dialog').close();dialogFocus?.focus?.();}
function textSizeDialog(){showDialog('Reading size',`<p>Choose the size that feels easiest. Your browser zoom works too.</p><div class="size-options">${[18,20,22].map(n=>`<button class="btn secondary" data-action="set-size" data-size="${n}" aria-pressed="${state.textSize===n}">${n===18?'Comfortable':n===20?'Large':'Extra large'}<br>${n}px</button>`).join('')}</div><p class="size-preview">Read a little. Remember a little. Learn something new.</p>`);}
function helpDialog(){showDialog('A simple way to study',`<p><strong>${E(D.edition)} · Ages ${D.ages} · Matthew ${D.range}</strong></p><ul><li><strong>Chapters:</strong> open a guide, read the NKJV chapter, then talk through the notes.</li><li><strong>Practice:</strong> try a short quiz, flashcards, or a full review.</li><li><strong>Progress:</strong> see your results and tick off your four-week plan.</li></ul><h3>For ${D.key==='junior'?'grown-ups and teachers':'teachers and study groups'}</h3><p>${D.key==='junior'?'Read questions together when needed. Keep sessions short and encouraging.':'Use the reflection prompts for discussion and the verse references to check answers together.'} These questions are practice, not an official competition syllabus. Use your organiser’s rules and memory verse list first.</p><h3>NKJV reading</h3><p>The notes and questions are original paraphrases. Full NKJV chapters open on Bible Gateway. Use your class’s NKJV Bible for exact wording.</p><p>The New King James Version (NKJV) is published by Thomas Nelson. NKJV text © 1982 Thomas Nelson. This independent study companion is not an official NKJV product.</p><h3>Your progress</h3><p>Progress is saved only in this browser, using separate storage for each age-group app. There are no student accounts or analytics. Back up your progress before changing devices.</p><div class="button-row">${verseLink(D.range,'Open assigned NKJV chapters','btn secondary')}<button class="btn" data-action="close-dialog">Got it</button></div>`);}
function downloadBackup(){const blob=new Blob([JSON.stringify({product:'Matthew Quest',version:1,group:D.key,savedAt:new Date().toISOString(),progress:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Matthew-Quest-'+D.key+'-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress backup downloaded.');}
async function importBackup(file){if(!file)return;if(file.size>1000000){toast('Please choose a Matthew Quest backup under 1 MB.');return;}try{const d=JSON.parse(await file.text());if(d.product!=='Matthew Quest'||d.version!==1||d.group!==D.key||!d.progress||typeof d.progress!=='object'||Array.isArray(d.progress))throw new Error();const clean=Engine.normalise(d.progress,D);pendingImport=clean;showDialog('Restore this backup?',`<p>This will replace the progress currently saved in this app with ${clean.read.length} studied chapters and ${clean.history.length} completed quizzes from your backup.</p><div class="button-row"><button class="btn" data-action="confirm-import">Restore backup</button><button class="btn secondary" data-action="close-dialog">Keep current progress</button></div>`);}catch{toast('That is not a valid backup for this age-group app.');}}
let pendingImport=null;
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
if(action==='help')helpDialog();
else if(action==='text-size')textSizeDialog();
else if(action==='set-size'){state.textSize=Number(el.dataset.size);applyTheme();save();document.querySelectorAll('[data-action="set-size"]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.size)===state.textSize)));}
else if(action==='close-dialog')closeDialog();
else if(action==='mark-read'){const ch=Number(el.dataset.chapter);state.read=state.read.includes(ch)?state.read.filter(n=>n!==ch):[...state.read,ch];save();render();toast(state.read.includes(ch)?'Chapter marked as studied.':'Chapter marked ready to read.');}
else if(action==='chapter-quiz')startQuiz({mode:'practice',chapter:Number(el.dataset.chapter),count:D.key==='junior'?5:8});
else if(action==='start-practice')startQuiz({mode:'practice',chapter:setup.chapter,count:setup.count});
else if(action==='start-mock')startQuiz({mode:'mock',chapter:'all'});
else if(action==='start-review')startQuiz({mode:'review',chapter:'all',count:state.review.length,review:state.review});
else if(action==='replace-quiz'){closeDialog();const opts=pendingStart;pendingStart=null;if(opts)startQuiz(opts,true);}
else if(action==='resume-dialog'){closeDialog();pendingStart=null;go('quiz');}
else if(action==='answer'){const option=state.session?.items[state.session.index]?.options[Number(el.dataset.index)];state.session=Engine.choose(state.session,option);save();render();document.querySelector(`[data-action="answer"][data-index="${Number(el.dataset.index)}"]`)?.focus({preventScroll:true});}
else if(action==='check-answer')submitAnswer();
else if(action==='skip-question')submitAnswer(true);
else if(action==='next-question')nextQuestion();
else if(action==='save-quiz'){save();go('chapters');toast('Quiz saved. Come back whenever you’re ready.');}
else if(action==='end-quiz')showDialog('Finish this quiz now?',`<p>You have answered ${state.session.answers.length} of ${state.session.items.length} questions. Any unanswered questions will count as missed.</p><div class="button-row"><button class="btn" data-action="confirm-finish">Finish and see results</button><button class="btn secondary" data-action="close-dialog">Keep going</button></div><button class="text-button mt-4" data-action="save-from-dialog">Save it for later instead</button>`);
else if(action==='save-from-dialog'){closeDialog();save();go('chapters');toast('Your quiz is saved.');}
else if(action==='confirm-finish'){closeDialog();finishQuiz();}
else if(action==='retry-result'){const r=state.history.find(r=>r.id===value);if(r){const ids=Engine.summary(r,Q).missed;startQuiz({mode:'review',chapter:'all',count:ids.length,review:ids});}}
else if(action==='chapter-cards')openCards(Number(el.dataset.chapter));
else if(action==='start-cards')openCards(setup.chapter);
else if(action==='flip-card'){flash.flipped=!flash.flipped;render();document.querySelector('[data-action="flip-card"]')?.focus({preventScroll:true});}
else if(action==='card-known')rateCard(true);
else if(action==='card-review')rateCard(false);
else if(action==='next-card'){flash.index++;flash.flipped=false;showNextCard();}
else if(action==='previous-card'){flash.index=Math.max(0,flash.index-1);flash.flipped=false;showNextCard();}
else if(action==='shuffle-cards'){resetCards();render(true);}
else if(action==='all-cards'){flash.filter='all';resetCards();render();}
else if(action==='view-result')go('result/'+el.dataset.id);
else if(action==='next-step'){const next=C.find(c=>!state.read.includes(c.id));go(next?'chapter/'+next.id:'practice');}
else if(action==='export')downloadBackup();
else if(action==='import')document.getElementById('import-file').click();
else if(action==='confirm-import'){if(pendingImport){state=pendingImport;pendingImport=null;save();applyTheme();closeDialog();render();toast('Progress restored.');}}
else if(action==='reset')showDialog('Reset this app’s progress?',`<p>This clears studied chapters, learned cards, quiz results, checklists, and any saved quiz for ages ${D.ages}. Download a backup first if you want to keep them.</p><div class="button-row"><button class="btn danger" data-action="confirm-reset">Reset progress</button><button class="btn secondary" data-action="close-dialog">Keep my progress</button></div>`);
else if(action==='confirm-reset'){const size=state.textSize;state=Engine.defaults(D);state.textSize=size;save();flash.deck=[];closeDialog();go('progress');toast('This app’s progress has been reset.');}
});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='chapter-jump')go('chapter/'+el.value);else if(el.id==='quiz-chapter'){setup.chapter=el.value;render();document.getElementById('quiz-chapter')?.focus({preventScroll:true});}else if(el.id==='quiz-length')setup.count=Number(el.value);else if(el.id==='flash-chapter'){flash.chapter=el.value;resetCards();render();document.getElementById('flash-chapter')?.focus({preventScroll:true});}else if(el.id==='flash-filter'){flash.filter=el.value;resetCards();render();document.getElementById('flash-filter')?.focus({preventScroll:true});}else if(el.dataset.week){const id=el.dataset.week;state.weeks=el.checked?[...new Set([...state.weeks,id])]:state.weeks.filter(x=>x!==id);save();render();document.querySelector(`[data-week="${id}"]`)?.focus({preventScroll:true});}else if(el.id==='import-file'){importBackup(el.files[0]);el.value='';}});
window.addEventListener('hashchange',route);
applyTheme();route();
</script>
</body>
</html>
